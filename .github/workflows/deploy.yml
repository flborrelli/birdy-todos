name: Deploy para Firebase Hosting

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O predeploy do firebase.json roda "npm run build" (tsc + vite),
      # então as dependências precisam estar instaladas antes do deploy.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: birdy---to-do-s
          target: app
          channelId: live

      # As regras do Firestore não são publicadas aqui: a conta de serviço não tem
      # permissão para isso (403 em serviceusage). Publique à mão quando mudar
      # o firestore.rules:  npx firebase deploy --only firestore:rules
