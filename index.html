<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Birdy">
  <title>Birdy · Tarefas</title>
  <meta name="description" content="Anote. Organize. Voe mais leve.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://birdy-tarefas.web.app/">
  <meta property="og:title" content="Birdy · Tarefas">
  <meta property="og:description" content="Anote. Organize. Voe mais leve.">
  <meta property="og:image" content="https://birdy-tarefas.web.app/brand/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Birdy · Tarefas">
  <meta name="twitter:description" content="Anote. Organize. Voe mais leve.">
  <meta name="twitter:image" content="https://birdy-tarefas.web.app/brand/og-image.png">
  <link rel="icon" type="image/svg+xml" href="brand/birdy-icon-64.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/brand/birdy-tokens.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <script>(function(){var t=localStorage.getItem('birdy-theme');if(t&&t!=='auto')document.documentElement.setAttribute('data-theme',t)})();</script>
</head>
<body>

<!-- Tela de login -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <svg class="login-logo-light" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120">
        <rect width="360" height="120" rx="14" fill="#F1EFE8"/>
        <defs><g id="bl-bird">
          <rect width="40" height="40" rx="9" fill="#F1EFE8"/>
          <rect x="8.5" y="17.5" width="18.75" height="12.5" rx="3.75" fill="#1A1A1A" transform="rotate(-8,18,24)"/>
          <circle cx="23.75" cy="12.5" r="5.625" fill="#1A1A1A"/>
          <polygon points="8.5,21.25 3.75,27.5 11.25,27.5" fill="#1A1A1A"/>
          <polygon points="11.25,18.75 23.75,16.25 22.5,21.25 11.25,22.5" fill="#1A1A1A" opacity="0.45"/>
          <polygon points="28.75,11.875 34.375,13.125 28.75,15" fill="#1A1A1A"/>
          <circle cx="25" cy="11.875" r="1.75" fill="#F1EFE8"/>
          <circle cx="25.625" cy="11.25" r="0.5625" fill="#1A1A1A"/>
        </g></defs>
        <g transform="translate(36,18)"><use href="#bl-bird"/></g>
        <text x="88" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="600" fill="#1A1A1A" letter-spacing="-1" dominant-baseline="baseline">Birdy</text>
        <line x1="36" y1="70" x2="324" y2="70" stroke="#D3D1C7" stroke-width="0.5"/>
        <text x="180" y="97" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#888780" letter-spacing="1.2">Anote. Organize. Voe mais leve.</text>
      </svg>
      <svg class="login-logo-dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120">
        <rect width="360" height="120" rx="14" fill="#1A1A1A"/>
        <defs><g id="bd-bird">
          <rect width="40" height="40" rx="9" fill="#1A1A1A"/>
          <rect x="8.5" y="17.5" width="18.75" height="12.5" rx="3.75" fill="white" transform="rotate(-8,18,24)"/>
          <circle cx="23.75" cy="12.5" r="5.625" fill="white"/>
          <polygon points="8.5,21.25 3.75,27.5 11.25,27.5" fill="white"/>
          <polygon points="11.25,18.75 23.75,16.25 22.5,21.25 11.25,22.5" fill="white" opacity="0.55"/>
          <polygon points="28.75,11.875 34.375,13.125 28.75,15" fill="white"/>
          <circle cx="25" cy="11.875" r="1.75" fill="#1A1A1A"/>
          <circle cx="25.625" cy="11.25" r="0.5625" fill="white"/>
        </g></defs>
        <g transform="translate(36,18)"><use href="#bd-bird"/></g>
        <text x="88" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="600" fill="white" letter-spacing="-1" dominant-baseline="baseline">Birdy</text>
        <line x1="36" y1="70" x2="324" y2="70" stroke="#333333" stroke-width="0.5"/>
        <text x="180" y="97" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#888780" letter-spacing="1.2">Anote. Organize. Voe mais leve.</text>
      </svg>
    </div>
    <div class="login-sub">Entre com sua conta Google para acessar suas tarefas de qualquer dispositivo.</div>
    <button class="btn-google" id="btn-google-login">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 6.293C4.672 4.166 6.656 3.58 9 3.58z"/>
      </svg>
      Entrar com Google
    </button>
  </div>
</div>

<!-- App principal: o layout (B ou C) é montado aqui por src/main.ts -->
<div class="app-root" id="main-app" style="display:none">
  <div id="layout-root"></div>
</div>

<!-- Seletor temporário de layout (testar B x C) -->
<div class="layout-switch" id="layout-switch" style="display:none" role="group" aria-label="Testar layout">
  <span class="layout-switch-label">Layout</span>
  <button type="button" data-layout-btn="b" onclick="setLayout('b')">B · Painel</button>
  <button type="button" data-layout-btn="c" onclick="setLayout('c')">C · Passarinho</button>
</div>
<!-- FAB (mobile) -->
<button class="fab" onclick="fabAction()" aria-label="Nova pendência" id="fab" style="display:none">
  <i class="ti ti-plus" aria-hidden="true"></i>
</button>

<!-- Modal: pendência -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title-text" id="modal-title-el">Nova pendência</span>
      <button class="icon-btn" onclick="closeModal()" aria-label="Fechar"><i class="ti ti-x"></i></button>
    </div>
    <input type="text" id="m-title" placeholder="O que precisa fazer?"
           onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('m-note').focus();}">
    <textarea id="m-note" placeholder="Detalhes (opcional)…"></textarea>
    <select id="m-list" style="display:none;margin-top:8px"></select>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-add" onclick="saveModal()" id="modal-save-btn">
        <div class="spinner"></div>
        <span class="btn-label">Adicionar</span>
      </button>
    </div>
  </div>
</div>

<!-- Modal: despesa recorrente -->
<div class="modal-overlay" id="rec-modal-overlay" onclick="if(event.target===this)closeRecurringModal()" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title-text" id="rec-modal-title">Nova despesa recorrente</span>
      <button class="icon-btn" onclick="closeRecurringModal()" aria-label="Fechar"><i class="ti ti-x"></i></button>
    </div>
    <input type="text" id="rec-name" placeholder="Nome (ex: Aluguel, Internet…)"
           onkeydown="if(event.key==='Enter')document.getElementById('rec-amount').focus()">
    <div class="brl-input-wrap" style="margin-top:8px">
      <span class="brl-prefix">R$</span>
      <input type="text" id="rec-amount" placeholder="Opcional"
             oninput="maskBRL(this);updateRecVariable()" inputmode="decimal"
             onkeydown="if(event.key==='Enter')document.getElementById('rec-due').focus()">
    </div>
    <div class="brl-input-wrap">
      <span class="brl-prefix">Vence dia</span>
      <input type="number" id="rec-due" placeholder="Opcional (1 a 31)" min="1" max="31" step="1" inputmode="numeric"
             oninput="updateDueHint('rec')"
             onkeydown="if(event.key==='Enter')saveRecurringModal()">
    </div>
    <p class="due-hint" id="rec-due-hint"></p>
    <label class="check-row">
      <input type="checkbox" id="rec-variable" onchange="updateRecVariable()">
      <span>O valor muda todo mês (ex.: energia, água)</span>
    </label>
    <p class="due-hint" id="rec-var-hint"></p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeRecurringModal()">Cancelar</button>
      <button class="btn-add" onclick="saveRecurringModal()" id="rec-modal-save-btn">
        <div class="spinner"></div>
        <span class="btn-label">Salvar</span>
      </button>
    </div>
  </div>
</div>

<!-- Modal: ajustar despesa fixa só neste mês -->
<div class="modal-overlay" id="mo-modal-overlay" onclick="if(event.target===this)closeMonthModal()" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title-text" id="mo-modal-title">Editar este mês</span>
      <button class="icon-btn" onclick="closeMonthModal()" aria-label="Fechar"><i class="ti ti-x"></i></button>
    </div>
    <p class="due-hint" id="mo-modal-sub" style="margin:0"></p>
    <div class="brl-input-wrap">
      <span class="brl-prefix">R$</span>
      <input type="text" id="mo-amount" placeholder="Valor deste mês"
             oninput="maskBRL(this)" inputmode="decimal"
             onkeydown="if(event.key==='Enter')document.getElementById('mo-due').focus()">
    </div>
    <div class="brl-input-wrap">
      <span class="brl-prefix">Vence dia</span>
      <input type="number" id="mo-due" placeholder="1 a 31" min="1" max="31" step="1" inputmode="numeric"
             oninput="updateDueHint('mo')"
             onkeydown="if(event.key==='Enter')saveMonthModal()">
    </div>
    <p class="due-hint" id="mo-due-hint"></p>
    <div class="modal-btns">
      <button class="btn-cancel" id="mo-reset-btn" onclick="resetMonthOverride()" style="display:none;margin-right:auto">Restaurar padrão</button>
      <button class="btn-cancel" onclick="closeMonthModal()">Cancelar</button>
      <button class="btn-add" onclick="saveMonthModal()" id="mo-save-btn">
        <div class="spinner"></div>
        <span class="btn-label">Salvar</span>
      </button>
    </div>
  </div>
</div>

<!-- Modal: pagamento avulso -->
<div class="modal-overlay" id="pay-modal-overlay" onclick="handlePayModalOverlay(event)" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title-text" id="pay-modal-title">Novo pagamento</span>
      <button class="icon-btn" onclick="closePaymentModal()" aria-label="Fechar"><i class="ti ti-x"></i></button>
    </div>
    <input type="text" id="pm-desc" placeholder="Descrição (ex: Supermercado, Farmácia…)"
           onkeydown="if(event.key==='Enter')document.getElementById('pm-amount').focus()">
    <div class="brl-input-wrap" style="margin-top:8px">
      <span class="brl-prefix">R$</span>
      <input type="text" id="pm-amount" placeholder="0,00"
             oninput="maskBRL(this)" inputmode="decimal"
             onkeydown="if(event.key==='Enter')document.getElementById('pm-due').focus()">
    </div>
    <div class="brl-input-wrap">
      <span class="brl-prefix">Vence dia</span>
      <input type="number" id="pm-due" placeholder="1 a 31" min="1" max="31" step="1" inputmode="numeric"
             oninput="updateDueHint('pay')"
             onkeydown="if(event.key==='Enter')savePaymentModal()">
    </div>
    <p class="due-hint" id="pm-due-hint"></p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closePaymentModal()">Cancelar</button>
      <button class="btn-add" onclick="savePaymentModal()" id="pay-modal-save-btn">
        <div class="spinner"></div>
        <span class="btn-label">Adicionar</span>
      </button>
    </div>
  </div>
</div>

<!-- Modal: lista -->
<div class="modal-overlay" id="list-modal-overlay" onclick="if(event.target===this)closeListModal()" role="dialog" aria-modal="true">
  <div class="modal list-modal">
    <div class="modal-header">
      <span class="modal-title-text" id="list-modal-title">Nova lista</span>
      <button class="icon-btn" onclick="closeListModal()" aria-label="Fechar"><i class="ti ti-x"></i></button>
    </div>
    <p style="font-size:.75rem;color:var(--text2);margin:0 0 6px">Escolha um emoji</p>
    <div class="list-emoji-grid" id="list-emoji-grid">
      <button class="list-emoji-btn" data-emoji="📋" onclick="selectListEmoji(this)">📋</button>
      <button class="list-emoji-btn" data-emoji="💼" onclick="selectListEmoji(this)">💼</button>
      <button class="list-emoji-btn" data-emoji="🏠" onclick="selectListEmoji(this)">🏠</button>
      <button class="list-emoji-btn" data-emoji="🚀" onclick="selectListEmoji(this)">🚀</button>
      <button class="list-emoji-btn" data-emoji="🎯" onclick="selectListEmoji(this)">🎯</button>
      <button class="list-emoji-btn" data-emoji="📚" onclick="selectListEmoji(this)">📚</button>
      <button class="list-emoji-btn" data-emoji="💡" onclick="selectListEmoji(this)">💡</button>
      <button class="list-emoji-btn" data-emoji="🔧" onclick="selectListEmoji(this)">🔧</button>
      <button class="list-emoji-btn" data-emoji="🌿" onclick="selectListEmoji(this)">🌿</button>
      <button class="list-emoji-btn" data-emoji="⭐" onclick="selectListEmoji(this)">⭐</button>
      <button class="list-emoji-btn" data-emoji="🔥" onclick="selectListEmoji(this)">🔥</button>
      <button class="list-emoji-btn" data-emoji="🎨" onclick="selectListEmoji(this)">🎨</button>
      <button class="list-emoji-btn" data-emoji="📈" onclick="selectListEmoji(this)">📈</button>
      <button class="list-emoji-btn" data-emoji="🏋️" onclick="selectListEmoji(this)">🏋️</button>
      <button class="list-emoji-btn" data-emoji="✈️" onclick="selectListEmoji(this)">✈️</button>
      <button class="list-emoji-btn" data-emoji="🎵" onclick="selectListEmoji(this)">🎵</button>
    </div>
    <input type="text" id="list-modal-name" placeholder="Nome da lista…" style="width:100%;margin-top:12px"
           maxlength="40" onkeydown="if(event.key==='Enter')saveList()">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeListModal()">Cancelar</button>
      <button class="btn-add" onclick="saveList()" id="list-modal-save-btn">
        <div class="spinner"></div>
        <span class="btn-label">Salvar</span>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
